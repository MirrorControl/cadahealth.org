<title>CADA Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Force light — this is a portal, not a marketing page */
:root{
  color-scheme:light;
  --bg:#f4f3f0;
  --surface:#ffffff;
  --surface-raised:#f0ede9;
  --sidebar-bg:#ffffff;
  --navy:#1a1208;
  --navy-mid:#2c1e0c;
  --gold:#9a6e10;
  --gold-light:#f2e8d4;
  --teal:#0d7377;
  --teal-light:#e0f5f5;
  --red:#c0392b;
  --red-light:#fcecea;
  --green:#1a7a35;
  --green-light:#e4f7ea;
  --amber:#b85c00;
  --amber-light:#fff0e0;
  --text:#1c1c1e;
  --text-secondary:#4a4a4a;
  --text-muted:#767676;
  --border:#e3e0da;
  --border-light:#ebe8e2;
  --shadow:0 1px 4px rgba(0,0,0,.07),0 4px 16px rgba(0,0,0,.04);
  --shadow-md:0 2px 8px rgba(0,0,0,.09),0 8px 24px rgba(0,0,0,.06);
  --radius:12px;
  --sidebar-w:248px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

/* Auth loader */
#auth-loading{
  display:flex;align-items:center;justify-content:center;height:100vh;
  background:var(--bg);flex-direction:column;gap:14px;
}
.auth-spinner{
  width:36px;height:36px;border-radius:50%;
  border:3px solid var(--border);border-top-color:var(--gold);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.auth-loading-text{font-size:14px;color:var(--text-muted)}

/* Layout */
.app-layout{
  display:flex;min-height:100vh;
  padding-top:env(safe-area-inset-top,0px);
}

/* Sidebar */
.app-sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:var(--sidebar-bg);border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  padding:24px 16px 20px;
}

.sidebar-logo{
  display:flex;align-items:center;gap:9px;
  text-decoration:none;margin-bottom:28px;padding:0 4px;
}
.sidebar-logo-text{
  font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;
  color:var(--navy);letter-spacing:-.01em;
}
.sidebar-logo-badge{
  background:var(--gold);color:#fff;
  font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;
  padding:2px 6px;border-radius:4px;letter-spacing:.05em;
}

/* User card */
.sidebar-user{
  background:var(--bg);border-radius:10px;padding:14px;
  margin-bottom:20px;display:flex;align-items:center;gap:11px;
}
.user-avatar{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  background:var(--navy);color:#fff;
  font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.user-info{min-width:0;flex:1}
.user-name{
  font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;
  color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.user-email{font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Progress ring */
.sidebar-ring-wrap{
  display:flex;flex-direction:column;align-items:center;
  padding:20px 0 24px;border-bottom:1px solid var(--border);margin-bottom:20px;
}
.ring-label-top{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:14px}
.ring-svg-wrap{position:relative;width:96px;height:96px}
.ring-svg{transform:rotate(-90deg)}
.ring-track{fill:none;stroke:var(--border);stroke-width:7}
.ring-fill{fill:none;stroke:var(--gold);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.4,0,.2,1)}
.ring-fill.complete{stroke:var(--green)}
.ring-center{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
.ring-pct{
  font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;
  color:var(--navy);line-height:1;
}
.ring-pct-label{font-size:10px;color:var(--text-muted);margin-top:2px}
.ring-steps{font-size:12px;color:var(--text-muted);margin-top:8px}

/* Sidebar nav */
.sidebar-nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:8px;
  text-decoration:none;color:var(--text-secondary);
  font-size:13px;font-weight:500;transition:background .15s,color .15s;
  cursor:pointer;border:none;background:none;width:100%;text-align:left;
}
.nav-item:hover{background:var(--bg);color:var(--navy)}
.nav-item.active{background:var(--gold-light);color:var(--gold);font-weight:600}
.nav-item.locked{opacity:.45;pointer-events:none}
.nav-icon{width:16px;height:16px;flex-shrink:0;opacity:.7}
.nav-item.active .nav-icon{opacity:1}
.nav-item:hover .nav-icon{opacity:1}

.sidebar-divider{height:1px;background:var(--border);margin:12px 0}

.logout-btn{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:8px;
  font-size:13px;font-weight:500;color:var(--text-muted);
  cursor:pointer;border:none;background:none;width:100%;
  transition:background .15s,color .15s;
}
.logout-btn:hover{background:var(--red-light);color:var(--red)}

/* Main content */
.app-main{
  flex:1;min-width:0;
  padding:32px max(24px,env(safe-area-inset-right,0px)) 60px max(24px,env(safe-area-inset-left,0px));
  overflow-y:auto;max-height:100vh;
}

/* Welcome */
.welcome-row{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:16px;margin-bottom:28px;flex-wrap:wrap;
}
.welcome-greeting{
  font-family:'Space Grotesk',sans-serif;font-size:clamp(20px,3vw,26px);
  font-weight:700;color:var(--navy);margin-bottom:4px;
}
.welcome-sub{font-size:14px;color:var(--text-muted)}
.welcome-date{
  font-size:13px;color:var(--text-muted);text-align:right;padding-top:4px;
  white-space:nowrap;
}

/* CTA button row */
.cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
.btn-primary{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--navy);color:#fff;border:none;
  font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;
  padding:10px 20px;border-radius:8px;cursor:pointer;
  text-decoration:none;transition:background .15s,transform .1s;
}
.btn-primary:hover{background:var(--navy-mid);transform:translateY(-1px)}
.btn-secondary{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--surface);color:var(--navy);
  border:1.5px solid var(--border);
  font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;
  padding:10px 20px;border-radius:8px;cursor:pointer;
  text-decoration:none;transition:border-color .15s,transform .1s;
}
.btn-secondary:hover{border-color:var(--navy);transform:translateY(-1px)}
.btn-gold{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--gold);color:#fff;border:none;
  font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;
  padding:10px 20px;border-radius:8px;cursor:pointer;
  text-decoration:none;transition:background .15s,transform .1s;
}
.btn-gold:hover{background:#7a5208;transform:translateY(-1px)}

/* Stat cards */
.stat-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;margin-bottom:24px;
}
.stat-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px 20px;
  box-shadow:var(--shadow);
}
.stat-eyebrow{
  font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-muted);margin-bottom:8px;
  display:flex;align-items:center;gap:5px;
}
.stat-num{
  font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;
  color:var(--navy);line-height:1;margin-bottom:4px;
}
.stat-num.gold{color:var(--gold)}
.stat-num.green{color:var(--green)}
.stat-sub{font-size:12px;color:var(--text-muted);line-height:1.4}

/* Progress bar */
.prog-bar-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px 20px;
  box-shadow:var(--shadow);margin-bottom:24px;
}
.prog-bar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.prog-bar-title{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;color:var(--navy)}
.prog-bar-pct{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;color:var(--gold)}
.prog-track{height:8px;background:var(--surface-raised);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;border-radius:4px;transition:width .8s cubic-bezier(.4,0,.2,1);background:linear-gradient(90deg,var(--gold),#c8921a)}
.prog-fill.complete{background:linear-gradient(90deg,var(--green),#2ea84a)}

/* Two-column layout */
.content-cols{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
@media(max-width:820px){.content-cols{grid-template-columns:1fr}}

/* Section header */
.section-header{
  font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);
  margin-bottom:12px;padding:0 2px;
}

/* Module rows */
.module-row{
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:10px;padding:14px 16px;
  display:flex;align-items:center;gap:14px;
  text-decoration:none;transition:border-color .2s,box-shadow .2s;
  margin-bottom:8px;
}
.module-row:hover{border-color:var(--navy);box-shadow:var(--shadow)}
.module-row.done{border-color:rgba(26,122,53,.35)}
.module-row.next{border-color:rgba(200,146,26,.5)}
.module-row.locked{opacity:.5;pointer-events:none}

.row-icon{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.icon-done{background:var(--green-light);color:var(--green)}
.icon-next{background:var(--gold-light);color:var(--gold)}
.icon-locked{background:var(--surface-raised);color:var(--text-muted)}

.row-body{flex:1;min-width:0}
.row-num{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin-bottom:1px}
.row-title{
  font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;
  color:var(--navy);margin-bottom:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.row-desc{font-size:11px;color:var(--text-muted)}

.row-badge{
  font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;
  padding:4px 11px;border-radius:5px;white-space:nowrap;flex-shrink:0;
}
.badge-done{background:var(--green-light);color:var(--green)}
.badge-next{background:var(--gold-light);color:var(--amber)}
.badge-start{background:var(--navy);color:#fff}
.badge-locked{background:var(--surface-raised);color:var(--text-muted)}
.badge-cooling{background:var(--amber-light);color:var(--amber)}
.badge-passed{background:var(--green-light);color:var(--green)}

/* Sidebar cards */
.sidebar-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow);margin-bottom:14px;
}
.sc-eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px}
.sc-title{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;color:var(--navy);margin-bottom:6px;line-height:1.3}
.sc-desc{font-size:12px;color:var(--text-muted);line-height:1.5;margin-bottom:14px}
.sc-btn{
  display:block;text-align:center;text-decoration:none;border:none;cursor:pointer;width:100%;
  background:var(--navy);color:#fff;
  font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;
  padding:10px 16px;border-radius:7px;transition:background .15s;
}
.sc-btn:hover{background:var(--navy-mid)}
.sc-btn.gold{background:var(--gold)}
.sc-btn.gold:hover{background:#7a5208}

/* Cooldown card */
.cooldown-card{
  background:var(--amber-light);border:1.5px solid rgba(184,92,0,.2);
  border-radius:var(--radius);padding:20px;margin-bottom:14px;
}
.cooldown-eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);margin-bottom:6px}
.cooldown-title{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;color:var(--amber);margin-bottom:4px}
.cooldown-desc{font-size:12px;color:var(--text-muted);margin-bottom:12px;line-height:1.5}
.cooldown-timer{
  font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;
  color:var(--amber);letter-spacing:.04em;
}
.cooldown-unit{font-size:11px;color:var(--text-muted);margin-top:2px}

/* Credential card (post pass) */
.credential-card{
  background:linear-gradient(135deg,#1a1208 0%,#2c1e0c 100%);
  border-radius:var(--radius);padding:22px;
  box-shadow:var(--shadow-md);margin-bottom:28px;
  position:relative;overflow:hidden;
}
.credential-card::before{
  content:'';position:absolute;top:-40px;right:-40px;
  width:150px;height:150px;border-radius:50%;
  background:rgba(200,146,26,.08);pointer-events:none;
}
.cred-issuer{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:3px}
.cred-name{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;color:#fff;margin-bottom:12px;line-height:1.3}
.cred-id-row{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.cred-id{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;color:var(--gold);letter-spacing:.04em}
.cred-valid{font-size:11px;color:rgba(255,255,255,.45);margin-bottom:16px}
.cred-actions{display:flex;gap:8px;flex-wrap:wrap}
.cred-btn{
  display:inline-flex;align-items:center;gap:6px;
  font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700;
  padding:8px 14px;border-radius:6px;cursor:pointer;border:none;
  text-decoration:none;transition:opacity .15s;
}
.cred-btn:hover{opacity:.85}
.cred-btn-linkedin{background:#0a66c2;color:#fff}
.cred-btn-download{background:var(--gold);color:#fff}
.cred-btn-copy{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2)}

/* Celebration */
.celebration{
  background:linear-gradient(135deg,var(--green) 0%,#2ea84a 100%);
  border-radius:var(--radius);padding:24px 28px;margin-bottom:24px;text-align:center;
}
.cel-title{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:#fff;margin-bottom:6px}
.cel-desc{font-size:14px;color:rgba(255,255,255,.8);line-height:1.5}

/* Copied toast */
.copy-toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(12px);
  background:var(--navy);color:#fff;
  font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;
  padding:10px 20px;border-radius:8px;opacity:0;
  transition:opacity .2s,transform .2s;pointer-events:none;z-index:999;
  box-shadow:var(--shadow-md);
}
.copy-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Mobile sidebar */
.mobile-topbar{
  display:none;position:sticky;top:0;z-index:100;
  background:var(--sidebar-bg);border-bottom:1px solid var(--border);
  padding:12px 16px;align-items:center;justify-content:space-between;
}
.mobile-logo{
  font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;color:var(--navy);
  display:flex;align-items:center;gap:7px;text-decoration:none;
}

@media(max-width:680px){
  .app-sidebar{display:none}
  .mobile-topbar{display:flex}
  .app-main{max-height:none;padding:20px 16px 48px}
  .app-layout{flex-direction:column}
}

/* Responsive content */
@media(max-width:820px){
  .stat-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:480px){
  .stat-grid{grid-template-columns:1fr 1fr}
  .cred-actions{flex-direction:column}
}
</style>

<div id="auth-loading">
  <div class="auth-spinner"></div>
  <div class="auth-loading-text">Loading your dashboard...</div>
</div>

<!-- Mobile topbar -->
<div class="mobile-topbar">
  <a href="index.html" class="mobile-logo">

    <span>CareGuard</span>

      </a>
      <a class="nav-item" href="assessment.html">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Final Assessment
      </a>
      <a class="nav-item" id="nav-cert" href="verify.html">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>
        My Credential
      </a>
    </nav>

    <div class="sidebar-divider"></div>
    <button class="logout-btn" onclick="doLogout()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sign out
    </button>
  </aside>

  <!-- Main content (rendered by JS) -->
  <main class="app-main" id="main-content"></main>
</div>

<!-- Copy toast -->
<div class="copy-toast" id="copy-toast">Link copied to clipboard</div>

<script>
/* ── Constants ── */
const KEY_PASS     = 'cada_passed';
const KEY_FAIL     = 'cada_last_fail';
const KEY_CRED     = 'cada_credential_id';
const KEY_ENROLLED = 'cada_enrolled';
const MODULE_KEYS  = ['cada_m1_quiz_done','cada_m2_quiz_done','cada_m3_quiz_done','cada_m4_quiz_done','cada_m5_quiz_done','cada_m6_quiz_done'];
const PRACTICE_KEY = 'cada_practice_done';
const RETAKE_MS    = 72 * 60 * 60 * 1000;

const MODULES = [
  { num:1, file:'module1.html',  title:'The ABA Documentation Standard',                    desc:'Medical necessity, behavioral objectives, session note compliance' },
  { num:2, file:'module2.html',  title:'Prior Authorization: The Approval Lifecycle',         desc:'Auth submission, unit tracking, expiration management' },
  { num:3, file:'module3.html',  title:'ABA Billing Fundamentals',                           desc:'CPT codes, place of service, RBT vs BCBA billing distinctions' },
  { num:4, file:'module4.html',  title:'Medicaid Compliance and Audit Defense',              desc:'RAC audits, statistical extrapolation, appeal rights' },
  { num:5, file:'module5.html',  title:'The 2027 CPT Code Transition',                       desc:'97155 split, 0362T/0373T deletion, payer-specific timelines' },
  { num:6, file:'module6.html',  title:'Payer Rules, State Variations, and Real-World Scenarios', desc:'Payer-specific documentation, multi-payer prioritization, capstone' },
];

/* ── localStorage helpers ── */
function ls(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

/* ── Progress ── */
function getProgress(){
  const modulesDone  = MODULE_KEYS.filter(k => ls(k)==='1').length;
  const practiceDone = ls(PRACTICE_KEY)==='1';
  const passed       = ls(KEY_PASS)==='1';
  const enrolled     = ls(KEY_ENROLLED)==='1';
  const lastFail     = ls(KEY_FAIL);
  const credId       = ls(KEY_CRED);
  const inCooldown   = lastFail && !passed && (Date.now()-parseInt(lastFail,10)) < RETAKE_MS;
  const cooldownMs   = inCooldown ? (RETAKE_MS - (Date.now()-parseInt(lastFail,10))) : 0;

  // Steps: 6 modules + practice + assessment
  const completedSteps = modulesDone + (practiceDone?1:0) + (passed?1:0);
  const totalSteps = 8;
  const pct = Math.round((completedSteps/totalSteps)*100);

  return { modulesDone, practiceDone, passed, enrolled, credId, inCooldown, cooldownMs, lastFail, pct, completedSteps, totalSteps };
}

/* ── SVG icons ── */
const ICO_CHECK = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
const ICO_ARROW = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>`;
const ICO_LOCK  = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`;
const ICO_CLOCK = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`;
const ICO_LI    = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 0h-14c-2.76 0-5 2.24-5 5v14c0 2.76 2.24 5 5 5h14c2.76 0 5-2.24 5-5v-14c0-2.76-2.24-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.27c-.97 0-1.75-.79-1.75-1.75s.78-1.75 1.75-1.75 1.75.79 1.75 1.75-.78 1.75-1.75 1.75zm13.5 12.27h-3v-5.6c0-1.34-.03-3.07-1.87-3.07-1.87 0-2.16 1.46-2.16 2.97v5.7h-3v-11h2.88v1.5h.04c.4-.76 1.38-1.56 2.84-1.56 3.04 0 3.6 2 3.6 4.59v6.47z"/></svg>`;
const ICO_COPY  = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
const ICO_DL    = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;

/* ── Cooldown countdown ── */
let _countdownInterval = null;
function startCooldown(ms){
  if(_countdownInterval) clearInterval(_countdownInterval);
  const el = document.getElementById('cooldown-display');
  if(!el) return;
  function tick(){
    const rem = Math.max(0, ms - (Date.now()-parseInt(ls(KEY_FAIL),10)));
    if(rem<=0){ clearInterval(_countdownInterval); el.textContent='Ready to retake'; return; }
    const h = Math.floor(rem/3600000);
    const m = Math.floor((rem%3600000)/60000);
    const s = Math.floor((rem%60000)/1000);
    el.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
  tick();
  _countdownInterval = setInterval(tick, 1000);
}

/* ── Progress ring ── */
function updateRing(pct){
  const circumference = 251.3;
  const offset = circumference - (circumference * pct/100);
  const fill = document.getElementById('ring-fill');
  if(fill){
    fill.style.strokeDashoffset = offset;
    if(pct===100) fill.classList.add('complete');
  }
  const pctEl = document.getElementById('ring-pct');
  if(pctEl) pctEl.textContent = pct+'%';
}

/* ── Copy to clipboard ── */
function copyVerifyLink(credId){
  const url = `https://cadahealth.org/verify.html?id=${credId}`;
  navigator.clipboard.writeText(url).then(()=>{
    const t = document.getElementById('copy-toast');
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2500);
  }).catch(()=>{});
}

/* ── LinkedIn URL ── */
function linkedinUrl(credId){
  const params = new URLSearchParams({
    startTask:'CERTIFICATION_NAME',
    name:'Certified ABA Documentation Advocate (CADA)',
    organizationName:'CareGuard Institute',
    issueYear:'2027',issueMonth:'1',
    expirationYear:'2027',expirationMonth:'12',
    certUrl:'https://cadahealth.org/verify.html',
    certId: credId||''
  });
  return 'https://www.linkedin.com/profile/add?'+params.toString();
}

/* ── Greeting ── */
function greeting(){
  const h = new Date().getHours();
  if(h<12) return 'Good morning';
  if(h<17) return 'Good afternoon';
  return 'Good evening';
}
function formatDate(){
  return new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
}

/* ── Render ── */
function render(user){
  const p = getProgress();

  // Sidebar user card
  const rawName = user?.user_metadata?.full_name || user?.email?.split('@')[0] || 'Learner';
  const initials = rawName.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  const sbAvatar = document.getElementById('sb-avatar');
  const sbName   = document.getElementById('sb-name');
  const sbEmail  = document.getElementById('sb-email');
  if(sbAvatar) sbAvatar.textContent = initials;
  if(sbName)   sbName.textContent   = rawName;
  if(sbEmail)  sbEmail.textContent  = user?.email||'';

  // Ring
  setTimeout(()=>updateRing(p.pct), 50);
  const ringsEl = document.getElementById('ring-steps');
  if(ringsEl) ringsEl.textContent = `${p.completedSteps} of ${p.totalSteps} steps`;

  // Credential nav — unlock after pass
  const navCert = document.getElementById('nav-cert');
  if(navCert && !p.passed) navCert.classList.add('locked');

  // Build main
  const main = document.getElementById('main-content');
  if(!main) return;

  // ── Next step logic ──
  let nextHref = '', nextLabel = '', nextDesc = '';
  if(!p.passed && !p.inCooldown){
    let firstInc = -1;
    for(let i=0;i<6;i++){ if(!ls(MODULE_KEYS[i])){ firstInc=i; break; } }
    if(firstInc>=0){
      nextHref=MODULES[firstInc].file;
      nextLabel=`Continue: Module ${firstInc+1}`;
      nextDesc=MODULES[firstInc].title;
    } else if(!p.practiceDone){
      nextHref='practice-exam.html'; nextLabel='Take Practice Exam'; nextDesc='12 questions, unlimited retakes, rationales on submit';
    } else {
      nextHref='assessment.html'; nextLabel='Take Final Assessment'; nextDesc='20 questions, 80% required, 72-hour retake wait on fail';
    }
  } else if(p.inCooldown){
    nextHref='practice-exam.html'; nextLabel='Review Weak Areas'; nextDesc='Reinforce before your retake unlocks';
  }

  // ── Module rows ──
  let firstInc2=-1;
  for(let i=0;i<6;i++){ if(!ls(MODULE_KEYS[i])){ firstInc2=i; break; } }

  const moduleRows = MODULES.map((mod,i)=>{
    const done   = ls(MODULE_KEYS[i])==='1';
    const isNext = !done && i===firstInc2;
    const cls    = done?'done':isNext?'next':'';
    const iconCls= done?'icon-done':isNext?'icon-next':'icon-locked';
    const icon   = done?ICO_CHECK:isNext?ICO_ARROW:ICO_LOCK;
    const badge  = done?'badge-done':isNext?'badge-next':'badge-locked';
    const badgeTx= done?'Complete':isNext?'Up Next':'Upcoming';
    return `
      <a class="module-row ${cls}" href="${mod.file}">
        <div class="row-icon ${iconCls}">${icon}</div>
        <div class="row-body">
          <div class="row-num">Module ${mod.num}</div>
          <div class="row-title">${mod.title}</div>
          <div class="row-desc">${mod.desc}</div>
        </div>
        <span class="row-badge ${badge}">${badgeTx}</span>
      </a>`;
  }).join('');

  // ── Practice row ──
  const pracBadge  = p.practiceDone?'badge-done':'badge-start';
  const pracBadgeTx= p.practiceDone?'Complete':'Take Exam';
  const pracRow = `
    <a class="module-row ${p.practiceDone?'done':''}" href="practice-exam.html">
      <div class="row-icon ${p.practiceDone?'icon-done':'icon-next'}">${p.practiceDone?ICO_CHECK:ICO_ARROW}</div>
      <div class="row-body">
        <div class="row-num">Practice Exam</div>
        <div class="row-title">Full Practice Assessment</div>
        <div class="row-desc">12 questions, unlimited retakes, rationales revealed on submit</div>
      </div>
      <span class="row-badge ${pracBadge}">${pracBadgeTx}</span>
    </a>`;

  // ── Assessment row ──
  const asmBadge  = p.passed?'badge-passed':p.inCooldown?'badge-cooling':'badge-start';
  const asmBadgeTx= p.passed?'Passed':p.inCooldown?'Cooling Down':'Take Now';
  const asmRow = `
    <a class="module-row ${p.passed?'done':p.inCooldown?'next':''}" href="assessment.html">
      <div class="row-icon ${p.passed?'icon-done':p.inCooldown?'icon-next':'icon-next'}">${p.passed?ICO_CHECK:p.inCooldown?ICO_CLOCK:ICO_ARROW}</div>
      <div class="row-body">
        <div class="row-num">Final Assessment</div>
        <div class="row-title">CADA Certification Exam</div>
        <div class="row-desc">20 questions, 80% to pass (16/20), 72-hour retake wait on fail</div>
      </div>
      <span class="row-badge ${asmBadge}">${asmBadgeTx}</span>
    </a>`;

  // ── Celebration / credential card ──
  const credSection = p.passed ? `
    <div class="celebration">
      <div class="cel-title">CADA Certified for 2027</div>
      <div class="cel-desc">Your credential is active through December 31, 2027. Share it with employers and billing teams.</div>
    </div>
    <div class="credential-card">
      <div class="cred-issuer">CareGuard Institute</div>
      <div class="cred-name">Certified ABA Documentation Advocate</div>
      <div class="cred-id-row">
        <span class="cred-id">${p.credId||'CADA-2027-PENDING'}</span>
      </div>
      <div class="cred-valid">Valid January 1 through December 31, 2027</div>
      <div class="cred-actions">
        <a class="cred-btn cred-btn-linkedin" href="${linkedinUrl(p.credId||'')}" target="_blank" rel="noopener">
          ${ICO_LI} Add to LinkedIn
        </a>
        <a class="cred-btn cred-btn-download" href="verify.html">
          ${ICO_DL} Download Certificate
        </a>
        <button class="cred-btn cred-btn-copy" onclick="copyVerifyLink('${p.credId||''}')">
          ${ICO_COPY} Copy Verify Link
        </button>
      </div>
    </div>` : '';

  // ── Stat cards ──
  const daysLeft = Math.ceil((new Date('2028-01-01')-new Date())/86400000);
  const statsHtml = `
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-eyebrow">Modules</div>
        <div class="stat-num ${p.modulesDone===6?'green':''}">${p.modulesDone}<span style="font-size:16px;font-weight:500;color:var(--text-muted)">/6</span></div>
        <div class="stat-sub">modules completed</div>
      </div>
      <div class="stat-card">
        <div class="stat-eyebrow">Practice Exam</div>
        <div class="stat-num ${p.practiceDone?'green':''}">
          ${p.practiceDone
            ? ICO_CHECK.replace('width="16"','width="28"').replace('height="16"','height="28"')
            : '<span style="font-size:16px;color:var(--text-muted)">Not taken</span>'}
        </div>
        <div class="stat-sub">${p.practiceDone?'Completed and reviewed':'Complete before final exam'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-eyebrow">Assessment</div>
        <div class="stat-num ${p.passed?'green':p.inCooldown?'gold':''}">
          ${p.passed?'Passed':p.inCooldown?'Cooldown':'Pending'}
        </div>
        <div class="stat-sub">${p.passed?'Credential issued 2027':p.inCooldown?'Retake available soon':'Pass at 80% to earn credential'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-eyebrow">Days to Expiry</div>
        <div class="stat-num ${p.passed?'gold':''}">${p.passed?daysLeft:'N/A'}</div>
        <div class="stat-sub">${p.passed?'days until Dec 31, 2027':'Earn your credential first'}</div>
      </div>
    </div>`;

  // ── Progress bar ──
  const progBar = `
    <div class="prog-bar-card">
      <div class="prog-bar-header">
        <span class="prog-bar-title">Overall Completion</span>
        <span class="prog-bar-pct">${p.pct}%</span>
      </div>
      <div class="prog-track">
        <div class="prog-fill ${p.pct===100?'complete':''}" style="width:${p.pct}%"></div>
      </div>
    </div>`;

  // ── Sidebar cards ──
  const cooldownCard = p.inCooldown ? `
    <div class="cooldown-card">
      <div class="cooldown-eyebrow">${ICO_CLOCK} Assessment Cooldown</div>
      <div class="cooldown-title">Retake Unlocks In</div>
      <div class="cooldown-desc">Use this time to review weak areas in the practice exam before retaking.</div>
      <div class="cooldown-timer" id="cooldown-display">--:--:--</div>
      <div class="cooldown-unit">hours : minutes : seconds</div>
    </div>` : '';

  const nextCard = nextLabel ? `
    <div class="sidebar-card">
      <div class="sc-eyebrow">Up Next</div>
      <div class="sc-title">${nextLabel}</div>
      <div class="sc-desc">${nextDesc}</div>
      <a class="sc-btn ${p.inCooldown?'':'gold'}" href="${nextHref}">${nextLabel} &rarr;</a>
    </div>` : '';

  const verifyCard = p.passed ? `
    <div class="sidebar-card">
      <div class="sc-eyebrow">Share Your Credential</div>
      <div class="sc-title">Verification Page</div>
      <div class="sc-desc">Anyone with your Credential ID can verify your CADA 2027 status at cadahealth.org/verify.</div>
      <a class="sc-btn" href="verify.html" target="_blank">Open Verifier &rarr;</a>
    </div>` : '';

  // ── Full render ──
  main.innerHTML = `
    <div class="welcome-row">
      <div>
        <div class="welcome-greeting" id="main-greeting">${greeting()}, ${rawName.split(' ')[0]}.</div>
        <div class="welcome-sub">Here is where you are on your CADA certification path.</div>
      </div>
      <div class="welcome-date">${formatDate()}</div>
    </div>

    ${credSection}
    ${statsHtml}
    ${progBar}

    <div class="content-cols">
      <div>
        <div class="section-header">Training Modules</div>
        ${moduleRows}
        <div class="section-header" style="margin-top:20px">Assessments</div>
        ${pracRow}
        ${asmRow}
      </div>
      <div>
        ${cooldownCard}
        ${nextCard}
        ${verifyCard}
        <div class="sidebar-card" style="text-align:center;border-style:dashed">
          <div style="font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px">Need Help?</div>
          <div style="font-size:12px;color:var(--text-muted);line-height:1.5">Questions about your credential or enrollment? <a href="mailto:support@cadahealth.org" style="color:var(--gold);font-weight:600">support@cadahealth.org</a></div>
        </div>
      </div>
    </div>`;

  // Start cooldown timer after render
  if(p.inCooldown) startCooldown(p.cooldownMs);
}

/* ── Auth ── */
function doLogout(){
  if(window.netlifyIdentity){
    window.netlifyIdentity.logout();
  }
}

window.netlifyIdentity = window.netlifyIdentity || {};

function initAuth(){
  if(!window.netlifyIdentity || typeof window.netlifyIdentity.on !== 'function'){
    // Widget not loaded yet — wait briefly
    setTimeout(initAuth, 200);
    return;
  }

  window.netlifyIdentity.on('init', user => {
    if(!user){
      // Not logged in — send to enroll
      window.location.href = 'enroll.html';
      return;
    }
    // Logged in — show dashboard
    document.getElementById('auth-loading').hidden = true;
    document.getElementById('app').hidden = false;
    render(user);
  });

  window.netlifyIdentity.on('logout', () => {
    window.location.href = 'enroll.html';
  });

  window.netlifyIdentity.init();
}

initAuth();
</script>
